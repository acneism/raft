name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: go test -race -timeout 30m ./...
      - if: runner.os != 'Linux'
        run: go test -timeout 30m ./...

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff

  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./sim -run 'TestSim$|TestSimMembership$' -timeout 60m -args -sim.steps=1000000 -sim.seeds=16
      - run: go test ./sim -run 'TestSimLinearizable' -timeout 60m -v -args -sim.lin.steps=1000000 -sim.seeds=16 -sim.lin.out=${{ runner.temp }}/porcupine
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: porcupine-sim
          path: ${{ runner.temp }}/porcupine

  kill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./cmd/node -run TestKillCycles -timeout 30m -v -args -kill.cycles=30

  linearizability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./cmd/node -run TestLinearizability -timeout 30m -v -args -lin.duration=60s -lin.out=${{ runner.temp }}/linearizability.html
      - run: go test ./cmd/node -run TestMembership -timeout 30m -v -args -member.duration=60s -lin.out=${{ runner.temp }}/membership.html
      - run: go test ./cmd/node -run TestLinearizability -timeout 30m -v -args -lin.duration=60s -kill.lease -lin.out=${{ runner.temp }}/lease.html
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: porcupine-cluster
          path: ${{ runner.temp }}/*.html

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./transport -run TestSnapshotThroughput -timeout 10m -v -args -snap.size=268435456

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - shell: bash
        run: |
          for f in FuzzDecodeMessage FuzzDecodeBatch FuzzDecodeOffer FuzzReadFrame; do
            for attempt in 1 2 3; do
              if go test ./transport -run '^$' -fuzz "^$f\$" -fuzztime 20s > fuzz.log 2>&1; then
                tail -3 fuzz.log
                break
              fi
              cat fuzz.log
              if [ -d "transport/testdata/fuzz/$f" ] || ! grep -q "context deadline exceeded" fuzz.log || [ "$attempt" = 3 ]; then
                exit 1
              fi
            done
          done
